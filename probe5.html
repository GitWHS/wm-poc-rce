<!doctype html>
<html><head><meta charset="utf-8"><title>WM-POC-OK</title></head>
<body><h1>WM-POC-P5</h1>
<script>
document.title='WM-POC-P5';
function note(t){ document.title=String(t); }
function call(mod, method, param){
  if(!window.JSCallJavaMgr){ note('NOJSB'); return; }
  window.JSCallJavaMgr.JSCallNative(JSON.stringify({
    callback:'window.__wmpoc', module:mod, method:method, param:param||{},
    callId:mod+'.'+method
  }));
}
var rows=[], finished=false, qi=0;
window.__wmpoc=function(res){
  var id=res.callId||'?';
  var code=res.code;
  var msg=String(res.message||'');
  var deny=msg.indexOf('URL denied')>=0 || msg.indexOf('not config')>=0;
  rows.push((deny?'D':'A')+' '+id+' c='+code+' '+msg.slice(0,48));
};
function flush(){
  if(qi<rows.length){ note(rows[qi++]); setTimeout(flush, 900); return; }
  if(finished){ note('P5-DONE n='+rows.length); return; }
  setTimeout(flush, 300);
}
setTimeout(flush, 500);
var steps=[
  function(){ note('JSB='+!!window.JSCallJavaMgr); },
  function(){ call('CommonPlugin','GetPerformance',{}); },
  function(){ call('DevicePlugin','GetDeviceInfo',{}); },
  function(){ call('DevicePlugin','CheckUpgrade',{}); },
  function(){ call('CommonPlugin','GetClipboard',{}); },
  function(){ call('CommonPlugin','GetServerTimestampMsec',{}); },
  function(){ call('CommonPlugin','GetCurrentMeetingInfo',{}); },
  function(){ call('CommonPlugin','GetWebPageRunningContext',{}); },
  function(){ call('CommonPlugin','PrintLog',{level:1,msg:'p5'}); },
  function(){ call('CommonPlugin','RouterToExternalBrowser',{url:'https://httpbin.org/html'}); },
  function(){ call('CommonPlugin','OpenOperationUrl',{url:'https://httpbin.org/html'}); },
  function(){ call('CommonPlugin','LaunchMiniProgram',{originId:'gh_ebae2dbaabf7',path:'/pages/index/index',miniProgramType:0}); },
  function(){ call('UIPlugin','LoadTemplateWebView',{url:'https://httpbin.org/html'}); },
  function(){ call('UIPlugin','LaunchTransparentWebview',{url:'https://httpbin.org/html'}); },
  function(){ call('UIPlugin','ShowToast',{title:'p5'}); },
  function(){ call('OpenApiPlugin','GetOpenAppInfo',{}); },
  function(){ call('MonitorPlugin','AddLog',{type:1,msg:'p5'}); },
  function(){ call('DevtoolWebviewPlugin','GetOfflineEnable',{}); },
  function(){ call('DevtoolWebviewPlugin','GetOfflineDirList',{}); },
  function(){ call('DevtoolWebviewPlugin','GetMockSwitchState',{}); },
  function(){ call('IdeaWebViewPlugin','DownloadIdeaFile',{url:'https://httpbin.org/bytes/16'}); }
];
var i=0;
function next(){
  if(i>=steps.length){ finished=true; return; }
  try{ steps[i](); }catch(e){ rows.push('EX '+e); }
  i++;
  setTimeout(next, 700);
}
setTimeout(next, 400);
</script>
</body></html>
