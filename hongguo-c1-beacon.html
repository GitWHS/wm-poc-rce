}

  _handleMessageFromApp: function (msg) {
    var s;
    try { s = JSON.stringify(msg); } catch (e) { s = String(msg); }
    ping(s);
  }
};

  n++;
  if (!window.JS2NativeBridge) return;
  try {
    JS2NativeBridge._invokeMethod(JSON.stringify({
      func: "x.getAppInfo",
      params: {},
      __callback_id: "b" + n
    }));
  } catch (e) {}
}, 20);
setTimeout(function () {
  ping("nav");
  location.href = "https://reading.snssdk.com/reading_offline/drlazy/page/general-rules.html?title=c1b";
